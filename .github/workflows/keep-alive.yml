name: Supabase Keep-Alive

on:
  schedule:
    # الأفضل تشغيله كل 6 ساعات لضمان عدم احتساب فترة خمول طويلة
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  wake-up-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase and Verify Status
        env:
          # تم تعديل الرابط لاستخدام select=* لتجنب خطأ عدم وجود عمود id
          SUPABASE_URL: 'https://sztcuvoksveyuilzqpko.supabase.co/rest/v1/app_settings?select=*&limit=1'
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=15
          
          echo "📡 Connecting to Supabase..."
          
          for ((i=1; i<=MAX_RETRIES; i++)); do
            # نرسل الطلب ونخزن كود الحالة فقط
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" -X GET "$SUPABASE_URL" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY")
            
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Success! Database is Active and Responding (Status: 200)."
              exit 0
            else
              echo "⚠️ Attempt $i/$MAX_RETRIES failed (Status: $HTTP_STATUS). Database might be sleeping..."
              
              # طباعة رد السيرفر للمساعدة في التشخيص إذا فشل مرة أخرى (اختياري)
              if [ "$HTTP_STATUS" -eq 400 ]; then
                 echo "❌ Error 400: Check if Table or Column exists."
              fi

              if [ $i -lt $MAX_RETRIES ]; then
                echo "⏳ Waiting ${RETRY_DELAY} seconds for wake-up..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          echo "❌ Critical: Failed to wake up database after $MAX_RETRIES attempts."
          exit 1
